name: Update Portfolio ETH

on:
  schedule:
    # Lunes–Viernes cada 30 min entre 13:17-21:47 UTC
    - cron: '*/20 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # ← Seguridad: máx 15 min por ejecución

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Cache de dependencias
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Crear principios.json (Google Sheets)
      - name: Setup Google Service Account
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_JSON_KEY }}
        run: |
          echo "$GOOGLE_CREDS" > principios.json

      # 6. Crear firebase-service-key.json
      - name: Setup Firebase Service Account
        env:
          FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_CREDS" > firebase-service-key.json

      # 7. Crear .env con API keys
      - name: Setup environment variables
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          cat > .env << EOF
          ALPHA_VANTAGE_KEY=$ALPHA_VANTAGE_KEY
          FMP_KEY=$FMP_KEY
          FINNHUB_KEY=$FINNHUB_KEY
          EOF

      # 8. Ejecutar el script principal
      - name: Run main_V6.py
        run: |
          python main_V6.py

      # 9. Subir logs como artefactos (siempre, aunque falle)
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: |
            *.log
            output/
