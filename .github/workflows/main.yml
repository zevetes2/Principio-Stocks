name: Update Portfolio ETH

on:
  schedule:
    # ── Workflow 1 (FAST): cada 30 min entre 13:00 y 21:30 UTC, L-V ──
    - cron: '0,30 13-21 * * 1-5'
    # ── Workflow 2 (DEEP): 1×/día a las 05:00 UTC (borra esta línea si solo quieres FAST)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - deep

concurrency:
  group: portfolio-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Detectar modo según disparo
    env:
      RUN_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 5 * * *' && 'deep' || 'fast') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restaurar snapshots.csv de runs anteriores (para backtesting)
      - name: Restore snapshots cache
        uses: actions/cache@v4
        with:
          path: snapshots.csv
          key: snapshots-${{ github.run_id }}
          restore-keys: |
            snapshots-

      - name: Setup Google Service Account
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_JSON_KEY }}
        run: |
          echo "$GOOGLE_CREDS" > principios.json

      - name: Setup Firebase Service Account
        env:
          FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_CREDS" > firebase-service-key.json

      - name: Setup environment variables
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          cat > .env << EOF
          ALPHA_VANTAGE_KEY=$ALPHA_VANTAGE_KEY
          FMP_KEY=$FMP_KEY
          FINNHUB_KEY=$FINNHUB_KEY
          RUN_MODE=$RUN_MODE
          EOF

      - name: Run main_V6.py
        run: |
          echo "▶ Modo de ejecución: $RUN_MODE"
          python main_V6.py 2>&1 | tee execution.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs-${{ github.run_id }}
          path: execution.log
          retention-days: 7
          if-no-files-found: warn

      - name: Save snapshots cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: snapshots.csv
          key: snapshots-${{ github.run_id }}
